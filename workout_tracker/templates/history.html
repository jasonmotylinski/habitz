{% extends "base.html" %}
{% block title %}History - Workout Tracker{% endblock %}

{% block content %}
<div class="page-header">
    <h1>History</h1>
</div>

<div class="tabs">
    <button class="tab active" id="tab-list" onclick="switchTab('list')">List</button>
    <button class="tab" id="tab-calendar" onclick="switchTab('calendar')">Calendar</button>
    <button class="tab" id="tab-progress" onclick="switchTab('progress')">Progress</button>
</div>

<div id="list-view">
    <div id="history-list"></div>
</div>

<!-- Edit modal -->
<div id="edit-modal" class="modal-overlay modal-centered hidden" onclick="if(event.target===this)closeEditModal()">
    <div class="modal">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
            <h2 style="margin:0;">Edit Exercise</h2>
            <button onclick="closeEditModal()" style="background:none;border:none;font-size:1.4rem;line-height:1;cursor:pointer;color:var(--text-muted);padding:4px 8px;">×</button>
        </div>
        <div id="edit-modal-body"></div>
    </div>
</div>

<div id="calendar-view" class="hidden">
    <div class="calendar-nav">
        <button onclick="changeMonth(-1)">‹</button>
        <h3 id="calendar-title"></h3>
        <button onclick="changeMonth(1)">›</button>
    </div>
    <div class="calendar-grid">
        <div class="calendar-header">S</div>
        <div class="calendar-header">M</div>
        <div class="calendar-header">T</div>
        <div class="calendar-header">W</div>
        <div class="calendar-header">T</div>
        <div class="calendar-header">F</div>
        <div class="calendar-header">S</div>
    </div>
    <div class="calendar-grid" id="calendar-days"></div>
    <div id="day-detail" class="mt-4"></div>
</div>

<div id="progress-view" class="hidden">
    <div class="sub-tabs">
        <button class="sub-tab active" id="subtab-week" onclick="switchProgressPeriod('week')">Week</button>
        <button class="sub-tab" id="subtab-month" onclick="switchProgressPeriod('month')">Month</button>
        <button class="sub-tab" id="subtab-year" onclick="switchProgressPeriod('year')">Year</button>
    </div>

    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-value" id="stat-total">—</div>
            <div class="stat-label">Total Sessions</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-avg">—</div>
            <div class="stat-label">Avg / Week</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-streak">—</div>
            <div class="stat-label">Current Streak</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-best">—</div>
            <div class="stat-label">Best Streak</div>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="frequency-chart"></canvas>
    </div>

    <div id="period-detail" class="hidden"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script>
let currentTab = 'list';
let calMonth, calYear;
let workoutDates = [];
let allLogs = [];
let expandedLogId = null;
let frequencyChart = null;
let currentPeriod = 'week';
let frequencyData = []; // Store period data for click handling

const now = new Date();
calMonth = now.getMonth() + 1;
calYear = now.getFullYear();

function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tab-list').classList.toggle('active', tab === 'list');
    document.getElementById('tab-calendar').classList.toggle('active', tab === 'calendar');
    document.getElementById('tab-progress').classList.toggle('active', tab === 'progress');
    document.getElementById('list-view').classList.toggle('hidden', tab !== 'list');
    document.getElementById('calendar-view').classList.toggle('hidden', tab !== 'calendar');
    document.getElementById('progress-view').classList.toggle('hidden', tab !== 'progress');

    if (tab === 'calendar') loadCalendar();
    else if (tab === 'progress') loadFrequency();
    else loadHistory();
}

function switchProgressPeriod(period) {
    currentPeriod = period;
    document.getElementById('subtab-week').classList.toggle('active', period === 'week');
    document.getElementById('subtab-month').classList.toggle('active', period === 'month');
    document.getElementById('subtab-year').classList.toggle('active', period === 'year');
    loadFrequency();
}

async function loadFrequency() {
    const data = await api.get(`/api/logs/frequency?period=${currentPeriod}`);

    // Update stats
    document.getElementById('stat-total').textContent = data.stats.total;
    document.getElementById('stat-avg').textContent = data.stats.avg_per_week;
    document.getElementById('stat-streak').textContent = `${data.stats.current_streak}w`;
    document.getElementById('stat-best').textContent = `${data.stats.best_streak}w`;

    // Store period data for click handling
    frequencyData = data.data;

    // Render chart
    const ctx = document.getElementById('frequency-chart').getContext('2d');
    const labels = data.data.map(d => d.label);
    const counts = data.data.map(d => d.count);

    if (frequencyChart) {
        frequencyChart.data.labels = labels;
        frequencyChart.data.datasets[0].data = counts;
        frequencyChart.update();
    } else {
        frequencyChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Workouts',
                    data: counts,
                    borderColor: '#4a9eff',
                    backgroundColor: 'rgba(74, 158, 255, 0.1)',
                    fill: true,
                    tension: 0.3,
                    pointRadius: 4,
                    pointHoverRadius: 6,
                    spanGaps: true,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                onClick: handleChartClick,
                plugins: {
                    legend: { display: false },
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            stepSize: 1,
                            color: '#8b949e',
                        },
                        grid: {
                            color: 'rgba(139, 148, 158, 0.1)',
                        },
                    },
                    x: {
                        ticks: {
                            color: '#8b949e',
                            maxTicksLimit: 8,
                        },
                        grid: {
                            display: false,
                        },
                    },
                },
            },
        });
    }

    // Hide detail when switching periods
    document.getElementById('period-detail').classList.add('hidden');
}

async function handleChartClick(event) {
    const points = frequencyChart.getElementsAtEventForMode(event, 'nearest', { intersect: true }, false);
    if (!points.length) return;

    const idx = points[0].index;
    const period = frequencyData[idx];
    if (!period || period.count === 0) return;

    // Calculate date range for this period
    const { from, to } = getPeriodDateRange(idx, currentPeriod);

    // Fetch workouts for this period
    const logs = await api.get(`/api/logs?from=${from}&to=${to}`);

    // Render detail
    const container = document.getElementById('period-detail');
    if (!logs.length) {
        container.innerHTML = `<p class="text-muted text-center">No workouts found</p>`;
    } else {
        container.innerHTML = `
            <h3 class="period-detail-title">${period.label} — ${logs.length} workout${logs.length !== 1 ? 's' : ''}</h3>
            <div class="period-detail-list">
                ${logs.map(log => {
                    const date = new Date(log.started_at);
                    const dateStr = date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
                    const exercises = (log.sets || []).map(s => s.exercise_name).filter((v, i, a) => a.indexOf(v) === i);
                    return `
                        <div class="period-detail-item">
                            <div class="period-detail-name">${log.workout_name}</div>
                            <div class="period-detail-meta">${dateStr}${exercises.length ? ' — ' + exercises.join(', ') : ''}</div>
                        </div>
                    `;
                }).join('')}
            </div>
        `;
    }
    container.classList.remove('hidden');
}

function getPeriodDateRange(idx, period) {
    const now = new Date();
    let from, to;

    if (period === 'week') {
        // Match Python: Monday-Sunday weeks
        // Find Monday of the current week
        const dayOfWeek = now.getDay(); // 0=Sun, 1=Mon, ..., 6=Sat
        const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
        const thisMonday = new Date(now);
        thisMonday.setDate(now.getDate() + mondayOffset);
        thisMonday.setHours(0, 0, 0, 0);

        // Go back idx weeks from this Monday
        from = new Date(thisMonday);
        from.setDate(thisMonday.getDate() - (idx * 7));
        to = new Date(from);
        to.setDate(from.getDate() + 6); // Sunday
        to.setHours(23, 59, 59, 999);
    } else if (period === 'month') {
        // Months are shown oldest first, 12 months total
        const start = new Date(now.getFullYear(), now.getMonth() - 11, 1);
        from = new Date(start.getFullYear(), start.getMonth() + idx, 1);
        to = new Date(from.getFullYear(), from.getMonth() + 1, 0, 23, 59, 59, 999);
    } else {
        // Years
        const minYear = frequencyData[0]?.label;
        from = new Date(parseInt(minYear) + idx, 0, 1);
        to = new Date(parseInt(minYear) + idx, 11, 31, 23, 59, 59, 999);
    }

    return {
        from: from.toISOString().split('T')[0],
        to: to.toISOString().split('T')[0],
    };
}

async function loadHistory() {
    const logs = await api.get('/api/logs');
    allLogs = logs;
    renderHistoryList();
}

async function loadCalendar() {
    const months = ['January', 'February', 'March', 'April', 'May', 'June',
                    'July', 'August', 'September', 'October', 'November', 'December'];
    document.getElementById('calendar-title').textContent = `${months[calMonth - 1]} ${calYear}`;

    const data = await api.get(`/api/logs/calendar?month=${calMonth}&year=${calYear}`);
    workoutDates = data.workout_dates || [];

    renderCalendar();
}

function renderCalendar() {
    const grid = document.getElementById('calendar-days');
    const firstDay = new Date(calYear, calMonth - 1, 1).getDay();
    const daysInMonth = new Date(calYear, calMonth, 0).getDate();
    const today = new Date();

    let html = '';
    // Empty cells before first day
    for (let i = 0; i < firstDay; i++) {
        html += '<div class="calendar-day empty"></div>';
    }

    for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${calYear}-${String(calMonth).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const isToday = today.getFullYear() === calYear && today.getMonth() + 1 === calMonth && today.getDate() === d;
        const hasWorkout = workoutDates.includes(dateStr);

        let cls = 'calendar-day';
        if (isToday) cls += ' today';
        if (hasWorkout) cls += ' has-workout';

        html += `<div class="${cls}" onclick="showDayDetail('${dateStr}')">${d}</div>`;
    }

    grid.innerHTML = html;
}

function changeMonth(delta) {
    calMonth += delta;
    if (calMonth > 12) { calMonth = 1; calYear++; }
    if (calMonth < 1) { calMonth = 12; calYear--; }
    loadCalendar();
}

async function showDayDetail(dateStr) {
    const container = document.getElementById('day-detail');
    // Filter logs for this date
    const dayLogs = allLogs.length ? allLogs.filter(l => l.started_at.startsWith(dateStr)) : [];

    if (!dayLogs.length) {
        // Fetch all logs and filter
        const logs = await api.get(`/api/logs?from=${dateStr}T00:00:00&to=${dateStr}T23:59:59`);
        if (!logs.length) {
            container.innerHTML = `<p class="text-muted text-center text-sm">No workout on ${formatDate(dateStr + 'T12:00:00')}</p>`;
            return;
        }
        renderDayLogs(container, logs, dateStr);
    } else {
        renderDayLogs(container, dayLogs, dateStr);
    }
}

function renderDayLogs(container, logs, dateStr) {
    container.innerHTML = logs.map(log => `
        <div class="history-entry">
            <div class="history-entry-header">
                <h3>${log.workout_name}</h3>
                <span class="date">${formatDate(log.started_at)}</span>
            </div>
        </div>
    `).join('');
}

function toggleExpand(logId) {
    expandedLogId = expandedLogId === logId ? null : logId;
    renderHistoryList();
}

function renderHistoryList() {
    const container = document.getElementById('history-list');
    const logs = allLogs;

    if (!logs.length) {
        container.innerHTML = `
            <div class="empty-state">
                <h3>No workouts yet</h3>
                <p>Complete a workout and it will show up here.</p>
            </div>
        `;
        return;
    }

    container.innerHTML = logs.map(log => {
        const isExpanded = expandedLogId === log.id;
        const exerciseMap = new Map();
        for (const s of (log.sets || [])) {
            if (!exerciseMap.has(s.exercise_id)) {
                exerciseMap.set(s.exercise_id, { name: s.exercise_name, type: s.exercise_type, sets: [] });
            }
            exerciseMap.get(s.exercise_id).sets.push(s);
        }

        const exerciseRows = Array.from(exerciseMap.values()).map(ex => {
            const exerciseId = ex.sets[0].exercise_id;
            const escapedName = ex.name.replace(/'/g, "\\'");
            if (ex.type === 'cardio') {
                const s = ex.sets[0];
                const result = s.completed ? `${s.duration_minutes} min` : 'Skipped';
                return `<div class="history-exercise" onclick="event.stopPropagation(); openEditModal(${log.id}, ${s.id}, '${escapedName}', 'cardio', ${s.duration_minutes}, null)" style="cursor: pointer;">
                    <span class="name" style="flex: 1;">${ex.name}</span>
                    <span class="${s.completed ? 'result' : 'skipped'}">${result}</span>
                    <span class="history-exercise-actions">
                        <button class="history-exercise-progress" onclick="event.stopPropagation(); window.location.href=SCRIPT_ROOT+'/exercises/${exerciseId}/progress'" title="View progress">↗</button>
                        <button class="history-exercise-delete" onclick="event.stopPropagation(); deleteExercise(${log.id}, ${s.id})" title="Delete exercise">×</button>
                    </span>
                </div>`;
            }

            // Sort sets by set_number to match the circle order from the active workout
            const sortedSets = [...ex.sets].sort((a, b) => a.set_number - b.set_number);
            const completedSets = sortedSets.filter(s => s.completed);
            const anySetId = (completedSets[0] || sortedSets[0]).id;
            const weight = (sortedSets.find(s => s.weight != null) || {}).weight || null;
            // One reps value per set: actual if completed, planned if not — mirrors the circles
            const allReps = sortedSets.map(s => s.completed ? s.actual_reps : s.planned_reps).join(',');
            const isSkipped = completedSets.length === 0;
            const displayReps = isSkipped ? 'Skipped' : completedSets.map(s => s.actual_reps).join('/');
            return `<div class="history-exercise" onclick="event.stopPropagation(); openEditModal(${log.id}, ${anySetId}, '${escapedName}', 'strength', null, ${weight}, '${allReps}')" style="cursor: pointer;">
                <span class="name" style="flex: 1;">${ex.name}</span>
                <span class="${isSkipped ? 'skipped' : 'result'}">${displayReps}${!isSkipped && weight ? ' ' + weight + 'lb' : ''}</span>
                <span class="history-exercise-actions">
                    <button class="history-exercise-progress" onclick="event.stopPropagation(); window.location.href=SCRIPT_ROOT+'/exercises/${exerciseId}/progress'" title="View progress">↗</button>
                    <button class="history-exercise-delete" onclick="event.stopPropagation(); deleteExercise(${log.id}, ${anySetId})" title="Delete exercise">×</button>
                </span>
            </div>`;
        }).join('');

        return `
            <div class="history-entry${isExpanded ? ' expanded' : ''}" onclick="toggleExpand(${log.id})">
                <div class="history-entry-header">
                    <div style="flex: 1;">
                        <h3>${log.workout_name}</h3>
                        <span class="date">${formatDate(log.started_at)}</span>
                    </div>
                </div>
                ${exerciseRows}
                <div class="history-delete-workout">
                    <button class="history-change-date-btn" onclick="event.stopPropagation(); changeWorkoutDate(${log.id}, '${log.started_at}')">Change Date</button>
                    <button class="history-delete-workout-btn" onclick="event.stopPropagation(); deleteWorkout(${log.id})">Delete Workout</button>
                </div>
            </div>
        `;
    }).join('');
}

let editingSet = null;

async function changeWorkoutDate(logId, currentStartedAt) {
    const current = currentStartedAt.split('T')[0];
    const modal = document.getElementById('edit-modal');
    const body = document.getElementById('edit-modal-body');
    body.innerHTML = `
        <h3 style="margin-bottom: 1rem;">Change Workout Date</h3>
        <div class="form-group">
            <label class="form-label">Date</label>
            <input type="date" id="change-date-input" class="form-control" value="${current}">
        </div>
        <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
            <button class="btn btn-primary" onclick="saveWorkoutDate(${logId})">Save</button>
            <button class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
        </div>
    `;
    modal.classList.remove('hidden');
}

async function saveWorkoutDate(logId) {
    const dateVal = document.getElementById('change-date-input').value;
    if (!dateVal) return;
    try {
        await api.put(`/api/logs/${logId}`, { started_at: dateVal + 'T12:00:00Z' });
        showToast('Date updated', 'success');
        closeEditModal();
        loadHistory();
    } catch (err) {
        showToast(err.message, 'error');
    }
}

async function deleteWorkout(logId) {
    if (await showConfirm('Delete this workout?', 'Delete', 'btn-danger')) {
        try {
            await api.delete(`/api/logs/${logId}`);
            showToast('Workout deleted', 'success');
            loadHistory();
        } catch (err) {
            showToast(err.message, 'error');
        }
    }
}

async function deleteExercise(logId, setId) {
    if (await showConfirm('Delete this exercise?', 'Delete', 'btn-danger')) {
        try {
            await api.delete(`/api/logs/${logId}/sets/${setId}`);
            showToast('Exercise deleted', 'success');
            loadHistory();
        } catch (err) {
            showToast(err.message, 'error');
        }
    }
}

function openEditModal(logId, setId, exerciseName, type, duration, weight, reps) {
    editingSet = { logId, setId, exerciseName, type, duration, weight, reps };
    const modal = document.getElementById('edit-modal');
    const body = document.getElementById('edit-modal-body');

    if (type === 'cardio') {
        body.innerHTML = `
            <div class="form-group">
                <label>${exerciseName}</label>
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="edit-duration" class="form-control" value="${duration || 0}" step="1">
                    <span class="text-muted" style="padding-top: 10px;">minutes</span>
                </div>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn btn-primary" onclick="saveEdit()">Save</button>
                <button class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
            </div>
        `;
    } else {
        const repsArray = reps ? reps.split(',') : [];
        body.innerHTML = `
            <div class="form-group">
                <label>${exerciseName}</label>
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="edit-weight" class="form-control" value="${weight || 0}" step="0.5" placeholder="Weight">
                    <span class="text-muted" style="padding-top: 10px;">lb</span>
                </div>
            </div>
            <div class="form-group">
                <label>Reps: ${repsArray.map((r, i) => `
                    <div style="display: inline-block; margin-right: 10px;">
                        <input type="number" class="form-control" value="${r}" style="width: 50px;" onchange="updateRepAtIndex(${i}, this.value)">
                    </div>
                `).join('')}</label>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn btn-primary" onclick="saveEdit()">Save</button>
                <button class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
            </div>
        `;
    }

    modal.classList.remove('hidden');
}

function closeEditModal() {
    document.getElementById('edit-modal').classList.add('hidden');
    editingSet = null;
}

function updateRepAtIndex(index, value) {
    if (!editingSet) return;
    const repsArray = editingSet.reps.split(',');
    repsArray[index] = parseInt(value);
    editingSet.reps = repsArray.join(',');
}

async function saveEdit() {
    if (!editingSet) return;

    try {
        if (editingSet.type === 'cardio') {
            const duration = parseInt(document.getElementById('edit-duration').value);
            const payload = { duration_minutes: duration };
            if (duration > 0) payload.completed = true;
            await api.put(`/api/logs/${editingSet.logId}/sets/${editingSet.setId}`, payload);
        } else {
            const weight = parseFloat(document.getElementById('edit-weight').value) || null;
            // Slice off the weight input (first); remaining inputs are one per set's reps
            const allInputs = Array.from(document.querySelectorAll('#edit-modal-body input[type="number"]'));
            const repInputs = allInputs.slice(1);

            // Find all sets for this exercise from allLogs so we update every set, not just the first
            const log = allLogs.find(l => l.id === editingSet.logId);
            const thisSet = log && log.sets && log.sets.find(s => s.id === editingSet.setId);
            const exerciseSets = thisSet
                ? log.sets.filter(s => s.exercise_id === thisSet.exercise_id)
                          .sort((a, b) => a.set_number - b.set_number)
                : null;

            if (exerciseSets && exerciseSets.length) {
                await Promise.all(exerciseSets.map((s, i) => {
                    // Use corresponding rep input; fall back to last input for overflow sets
                    const reps = repInputs[i]
                        ? parseInt(repInputs[i].value)
                        : parseInt(repInputs[repInputs.length - 1]?.value) || s.planned_reps;
                    return api.put(`/api/logs/${editingSet.logId}/sets/${s.id}`, {
                        weight,
                        actual_reps: reps,
                        completed: true,
                    });
                }));
            } else {
                // Fallback: update just the known set
                await api.put(`/api/logs/${editingSet.logId}/sets/${editingSet.setId}`, {
                    weight,
                    actual_reps: repInputs[0] ? parseInt(repInputs[0].value) : null,
                    completed: true,
                });
            }
        }

        showToast('Saved', 'success');
        closeEditModal();
        loadHistory();
    } catch (err) {
        showToast(err.message, 'error');
    }
}

loadHistory();
</script>
{% endblock %}
