{% extends "base.html" %}
{% block title %}Quick Log - Workout Tracker{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Quick Log</h1>
</div>

<form id="quick-log-form" onsubmit="return saveQuickLog(event)">
    <div class="form-group">
        <label for="workout-name">Workout Name</label>
        <input type="text" id="workout-name" class="form-control" placeholder="e.g. Meditation, Hiking, Hotel Gym" required autofocus>
    </div>
    <div class="form-group">
        <label for="workout-duration">Duration (minutes)</label>
        <input type="number" id="workout-duration" class="form-control" min="1" max="999" step="1" placeholder="e.g. 45" required>
    </div>
    <div class="form-group">
        <label for="workout-notes">Notes (optional)</label>
        <textarea id="workout-notes" class="form-control" rows="3" placeholder="Any details about this workout..."></textarea>
    </div>
    <button type="submit" class="btn btn-primary btn-block mt-2">Save</button>
</form>
{% endblock %}

{% block scripts %}
<script>
async function saveQuickLog(e) {
    e.preventDefault();
    const name = document.getElementById('workout-name').value.trim();
    if (!name) return;

    const duration = parseInt(document.getElementById('workout-duration').value) || null;
    const notes = document.getElementById('workout-notes').value.trim() || undefined;

    const payload = { custom_name: name, notes };
    if (duration) {
        const now = new Date().toISOString();
        const end = new Date(Date.now() + duration * 60000).toISOString();
        payload.started_at = now;
        payload.completed_at = end;
    }

    try {
        await api.post('/api/logs', payload);
        showToast('Workout logged!', 'success');
        window.location.href = SCRIPT_ROOT + '/';
    } catch (err) {
        showToast(err.message, 'error');
    }
}
</script>
{% endblock %}
